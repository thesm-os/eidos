name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ergon drives every Makefile target (`make check`, `make test-race`,
# …). Pin the version so the gate is reproducible; bump intentionally.
env:
  ERGON_VERSION: v1.10.1

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install ergon
        run: go install go.thesmos.sh/ergon/cmd/ergon@${{ env.ERGON_VERSION }}

      - name: Install development tools
        run: make bootstrap

      - name: Run pre-merge gate (tidy + lint + test + coverage)
        run: make check

  # Mutation testing is excluded from `make check` (see
  # checks.disabled in .ergon.yaml) because it runs the test suite
  # once per mutant, which is minutes rather than seconds. It runs
  # here as its own job so the local edit loop stays fast without the
  # gate being lost.
  #
  # --mutants is what makes a failure actionable: every survivor is
  # printed as file:line:col plus the mutation applied, so the log
  # names the specific assertion gap rather than a percentage.
  #
  # bootstrap is required — the gate shells out to the gremlins
  # binary, which `make bootstrap` installs.
  # mutation:
  #   name: mutation
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6

  #     - name: Set up Go
  #       uses: actions/setup-go@v6
  #       with:
  #         go-version: "1.26"
  #         check-latest: true
  #         cache: true

  #     - name: Install ergon
  #       run: go install go.thesmos.sh/ergon/cmd/ergon@${{ env.ERGON_VERSION }}

  #     - name: Install development tools
  #       run: make bootstrap

  #     - name: Run mutation testing per layer
  #       run: make check-mutation

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install ergon
        run: go install go.thesmos.sh/ergon/cmd/ergon@${{ env.ERGON_VERSION }}

      - name: Run tests under the race detector
        run: make test-race

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
