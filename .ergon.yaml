# ergon configuration for eidos.
#
# Values not declared here fall back to ergon's per-subsystem
# defaults. Inline comments document why each non-default value
# was chosen so reviewers can challenge or extend the policy.

# Project identity — used in help banners and as the directory
# name for cached artifacts (.eidos/, .coverage/, …).
name: eidos

# Module set discovered via go.work — ergon's auto-detection
# covers the ten-module split (root + lang/golang/{backend,frontend} +
# bridge/protogo + cli + cmd/eidos-reference + eidostest +
# lang/protobuf/frontend + plugins + reference) without
# hand-listing.
modules: []

# bootstrap — `ergon bootstrap`
bootstrap:
  extra_tools: []

# license — `ergon license` (apply) and `ergon lint license` (verify)
license:
  config_file: .go-license.yml
  # docs/superpowers is the internal-only working state per the
  # project's documented contributor rule ("never commit, never
  # reference"). .gitignore drops it; listing it here keeps
  # `ergon license` from walking a path that may exist on a
  # contributor's checkout from an earlier state.
  exclude_dirs:
    - .git
    - vendor
    - dist
    - node_modules
    - docs/superpowers
  exclude_files:
    - "*.gen.go"
    - "*.gen_test.go"

# markdown — markdownlint-cli2 invocation shared by `ergon fmt`
# (auto-fix) and `ergon lint md` (reporting only)
markdown:
  globs:
    - "**/*.md"
    - "#vendor"
    - "#dist"
    - "#node_modules"
    # Same rationale as the license exclusion above.
    - "#docs/superpowers"

# test — `ergon test` and its subcommands. Defaults preserved:
# count=3 catches flake, timeout=10m covers the full
# reference-acceptance pass, fuzz_time=30s bounds CI without
# preventing deeper local runs (bump via FUZZ_TIME=5m).
test:
  cpu: 4
  count: 3
  timeout: 10m
  race_count: 3
  fuzz_time: 30s

release:
  modules: []

lint:
  # error-prefix — `ergon check error-prefix`
  #
  # Convention: every errors.New / fmt.Errorf sentinel begins with
  # "<pkg-name>: " where <pkg-name> matches the `package` clause
  # of the declaring file. Avoids the "two packages, same generic
  # error string" debugging trap in multi-module repos.
  error_prefix:
    target_dirs: ["."]

# checks — `ergon check` umbrella
checks:
  # Stages removed from the umbrella `ergon check` run. Combines
  # with `--skip` on the CLI as a single denylist.
  #
  # mutation runs the test suite once per mutant — minutes rather
  # than seconds — so it stays out of the loop that runs on every
  # edit. It is still fully configured under `mutation:` below and
  # still gated: `make check-mutation` and the CI job invoke it
  # directly, which `disabled` does not block.
  disabled:
    - mutation
    - branch

  # Path globs both coverage AND mutation ignore. The reasons are
  # human-facing so reviewers can challenge new excludes on PR.
  excludes:
    - path: "**/testdata/**"
      reason: |
        Test inputs, not subjects of coverage. Frameworks load
        these via packages.Load / protocompile; the files are
        fixtures, not production code.
    - path: "pluginfixture/**"
      reason: |
        Sample Go types loaded as fixture input by tests in
        downstream modules. No logic to test; 0% is correct.
    - path: "sdk/**"
      reason: |
        Plugin-author façade. The package is re-export
        declarations (type aliases, var bindings) over plugin /
        priority / core — 684 lines carrying a single executable
        statement. Coverage is not a meaningful signal here; the
        re-exported symbols are covered in their owning packages.
    - path: "cmd/eidos-reference/**"
      reason: |
        Demonstration binary: main() plus plugin-slice wiring, no
        branching logic of its own. Its behaviour is covered
        black-box by eidostest/acceptancetest, which drives the
        built binary end to end.
    - path: "**/*.gen.go"
      reason: generated code; the generator's own tests cover it.
    - path: "**/*.gen_test.go"
      reason: generated test code; same.

  # Structural skip rules: function name + file pattern. Applied
  # to coverage AND mutation. Reserved for genuinely
  # untestable-by-design surfaces.
  skips:
    - label: interface-marker
      func_glob: isRef
      file_glob: "**/*_ref.go"
      # Interface-marker methods on emit.Ref variants. They exist
      # to satisfy the Ref interface and never have a callable
      # path — 0% coverage is by design.
    - label: defensive-unreachable
      func_glob: applyDefaults
      file_glob: "**/core/opt/options.go"
      # Defensive struct-deref guard in applyDefaults. Bind is
      # generic-constrained to a struct target at compile time,
      # so the runtime guard's early-return branch is unreachable
      # from any caller in the workspace. The guard stays as a
      # safety net for handwritten callers but isn't worth a
      # contorted export_test to cover.

  # coverage — `ergon check coverage`
  #
  # One entry per workspace module, spelled as a directory rather
  # than a `./...` glob — the same form the mutation layers use,
  # and matched the same way, by longest prefix. Naming every
  # module is what stops `.` acting as a catch-all: a new module
  # with no entry of its own would otherwise inherit the root's
  # bar silently, which is how a gate goes missing.
  #
  # The numbers state the goal, not what each package happens to
  # measure today: a module below target fails the gate and the
  # failure names the functions responsible.
  #
  # cmd/eidos-reference is absent on purpose — see the exclude
  # above. TestErgonCoverageLayers pins the set against go.work,
  # so an unlisted module fails rather than passing unmeasured.
  #
  # Branch gating is on. `require_branch: true` turns each
  # module's gobco branch percentage into a hard failure, and
  # `ergon check coverage` enforces line and branch together — no
  # separate stage invocation.
  coverage:
    packages:
      - path: "."
        line: 99
        branch: 95
        require_branch: true
      - path: "./bridge/protogo"
        line: 100
        branch: 95
        require_branch: true
      - path: "./cli"
        line: 65
        branch: 95
        require_branch: true
      - path: "./eidostest"
        line: 85
        branch: 90
        require_branch: true
      - path: "./lang/golang"
        line: 90
        branch: 90
        require_branch: true
      - path: "./lang/typescript"
        line: 95
        branch: 95
        require_branch: true
      - path: "./lang/protobuf"
        line: 81
        branch: 95
        require_branch: true
      - path: "./plugins"
        line: 86
        branch: 95
        require_branch: true
      - path: "./reference"
        line: 91
        branch: 95
        require_branch: true
    top_n: 10

  mutation:
    # mutation — `ergon check mutation`
    #
    # Two metrics gate independently per module. `score` is test
    # efficacy: of the mutants the suite reached, how many did it
    # kill? `coverage` is mutator coverage: of every viable mutant,
    # how many did the suite reach at all? A low score means the
    # assertions are weak; a low coverage means the tests never run
    # the code. They fail for different reasons and are fixed by
    # different work, so they are stated separately rather than
    # folded into one number.
    #
    # Both sit at 99 across every module. A surviving mutant is a
    # reproducible assertion gap with a file:line, not a percentage
    # to negotiate — `make check-mutation` passes --mutants so
    # every survivor is named.
    #
    # Excluded from `make check`: the gate runs the test suite once
    # per mutant, which would make the local edit loop unusable. CI
    # runs it as its own job.
    #
    # Layer paths are directories, not `./...` globs, and match by
    # longest prefix, so one entry per module covers everything
    # beneath it.
    packages:
      - path: "."
        score: 99
        coverage: 99
      - path: "./bridge/protogo"
        score: 99
        coverage: 99
      - path: "./cli"
        score: 99
        coverage: 99
      - path: "./cmd/eidos-reference"
        score: 99
        coverage: 99
      - path: "./eidostest"
        score: 99
        coverage: 99
      - path: "./lang/golang"
        score: 99
        coverage: 99
      - path: "./lang/protobuf"
        score: 99
        coverage: 99
      - path: "./plugins"
        score: 99
        coverage: 99
      - path: "./reference"
        score: 99
        coverage: 99
    gremlins:
      workers: 2
      test_cpu: 2
      timeout_coefficient: 30

  # commit-msg — `ergon check commit-msg <file>`
  #
  # Type list matches the project's conventional-commit usage in
  # `git log`. 80-byte subject ceiling (default 72) accommodates
  # the project's existing scoped subjects without rephrasing.
  commit_msg:
    types:
      - feat
      - fix
      - docs
      - refactor
      - test
      - ci
      - chore
      - perf
      - build
      - style
      - revert
    max_subject_length: 80
